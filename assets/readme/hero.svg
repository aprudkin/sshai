<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">sshai — context-frugal remote execution for AI agents</title>
  <desc id="desc">A remote Linux or Windows command becomes a compact passport while the full output is preserved as a local artifact.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76E6A6"/>
      <stop offset="1" stop-color="#B8F28A"/>
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1200" height="420" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="420" fill="#0B0D10"/>
    <path d="M0 74H1200M690 74V420" stroke="#292E35" stroke-width="1"/>
    <path d="M64 356H626" stroke="#292E35" stroke-width="1"/>

    <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="64" y="46" fill="#76E6A6">REMOTE EXECUTION / CONTEXT CONTROL</text>
      <text x="1136" y="46" text-anchor="end" fill="#9098A3">LINUX · WINDOWS · GO</text>
    </g>

    <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="62" y="192" fill="#F5F3ED" font-size="104" font-weight="760" letter-spacing="-4">sshai</text>
      <text x="66" y="242" fill="#C9CDD2" font-size="28" font-weight="520">Remote commands in.</text>
      <text x="66" y="280" fill="#F5F3ED" font-size="28" font-weight="650">Compact evidence out.</text>
      <rect x="66" y="313" width="286" height="5" rx="2.5" fill="url(#signal)"/>
      <text x="66" y="388" fill="#9098A3" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FULL OUTPUT STAYS LOCAL BY REFERENCE</text>
    </g>

    <g id="project-proof" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g id="remote-command">
        <text x="736" y="112" fill="#9098A3" font-size="18">01 / REMOTE</text>
        <rect x="736" y="132" width="400" height="66" rx="10" fill="#15191E" stroke="#353C45"/>
        <circle cx="760" cy="165" r="5" fill="#76E6A6"/>
        <text x="779" y="172" fill="#F5F3ED" font-size="20">journalctl · 8,412 lines</text>
      </g>

      <g id="bounded-passport">
        <text x="736" y="235" fill="#9098A3" font-size="18">02 / PASSPORT</text>
        <rect x="736" y="255" width="400" height="66" rx="10" fill="#15191E" stroke="#76E6A6"/>
        <text x="758" y="295" fill="#76E6A6" font-size="24" font-weight="700">a17</text>
        <text x="814" y="294" fill="#F5F3ED" font-size="20">exit=0 · bounded</text>
      </g>

      <g id="local-artifact">
        <text x="736" y="358" fill="#9098A3" font-size="18">03 / ARTIFACT</text>
        <path d="M736 379H1136" stroke="#353C45"/>
        <text x="736" y="406" fill="#C9CDD2" font-size="20">~/.sshai/art/a17</text>
        <text x="1136" y="406" text-anchor="end" fill="#76E6A6" font-size="20">612 KB saved</text>
      </g>

      <path d="M1120 201V243M1120 324V346" stroke="#76E6A6" stroke-width="2"/>
      <path d="M1114 237L1120 243L1126 237M1114 340L1120 346L1126 340"
            fill="none" stroke="#76E6A6" stroke-width="2"/>
    </g>
  </g>
</svg>
