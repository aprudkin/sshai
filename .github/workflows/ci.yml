name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.0.0"
          check-latest: false
      - run: scripts/check-release-tree.sh
      - run: node scripts/test_sshai_mode.mjs
      - run: scripts/test_install.sh
      - run: go test ./...
      - run: go vet ./...
